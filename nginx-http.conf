# MODAUI - Node.js Application (HTTP only for now)
# Reverse proxy to localhost:3000

upstream modaui_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP server - no HTTPS for now
server {
    listen 80;
    server_name modaui.com www.modaui.com;

    # Logging
    access_log /www/server/nginx/logs/modaui_access.log;
    error_log /www/server/nginx/logs/modaui_error.log;

    # Static assets (should be served by frontend)
    location ~* /assets/ {
        proxy_pass http://modaui_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
    }

    # API routes
    location ~ ^/api/ {
        proxy_pass http://modaui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://modaui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://modaui_backend;
        access_log off;
    }

    # Main application
    location / {
        proxy_pass http://modaui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}